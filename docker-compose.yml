version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: strata_wms_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: strata_wms
      MYSQL_ROOT_PASSWORD: strata_root_secret
      MYSQL_USER: strata_user
      MYSQL_PASSWORD: strata_password
    ports:
      - "33060:3306"
    volumes:
      - strata_mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pstrata_root_secret"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    container_name: strata_wms_backend
    restart: unless-stopped
    working_dir: /var/www/backend
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: strata_wms
      DB_USERNAME: strata_user
      DB_PASSWORD: strata_password
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8080
    volumes:
      - ./backend:/var/www/backend
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: strata_wms_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/backend
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
    container_name: strata_wms_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - nginx

volumes:
  strata_mysql_data:
